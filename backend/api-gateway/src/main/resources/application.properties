# Server
server.port=8080

# Application name
spring.application.name=api-gateway

# Gateway default filters
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

# Gateway routes - employee-service
spring.cloud.gateway.routes[0].id=employee-service
spring.cloud.gateway.routes[0].uri=lb://employee-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/employees/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1
spring.cloud.gateway.routes[0].filters[1].name=Retry
spring.cloud.gateway.routes[0].filters[1].args.retries=2
spring.cloud.gateway.routes[0].filters[1].args.methods=GET
spring.cloud.gateway.routes[0].filters[1].args.series=SERVER_ERROR
spring.cloud.gateway.routes[0].filters[1].args.backoff.firstBackoff=100ms
spring.cloud.gateway.routes[0].filters[1].args.backoff.maxBackoff=1s
spring.cloud.gateway.routes[0].filters[1].args.backoff.factor=2
spring.cloud.gateway.routes[0].filters[2].name=CircuitBreaker
spring.cloud.gateway.routes[0].filters[2].args.name=employeeCb
spring.cloud.gateway.routes[0].filters[2].args.fallbackUri=forward:/fallback

# Gateway routes - salary-service
spring.cloud.gateway.routes[1].id=salary-service
spring.cloud.gateway.routes[1].uri=lb://salary-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/salaries/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=1
spring.cloud.gateway.routes[1].filters[1].name=Retry
spring.cloud.gateway.routes[1].filters[1].args.retries=2
spring.cloud.gateway.routes[1].filters[1].args.methods=GET
spring.cloud.gateway.routes[1].filters[1].args.series=SERVER_ERROR
spring.cloud.gateway.routes[1].filters[1].args.backoff.firstBackoff=100ms
spring.cloud.gateway.routes[1].filters[1].args.backoff.maxBackoff=1s
spring.cloud.gateway.routes[1].filters[1].args.backoff.factor=2
spring.cloud.gateway.routes[1].filters[2].name=CircuitBreaker
spring.cloud.gateway.routes[1].filters[2].args.name=salaryCb
spring.cloud.gateway.routes[1].filters[2].args.fallbackUri=forward:/fallback

# Gateway routes - department-service
spring.cloud.gateway.routes[2].id=department-service
spring.cloud.gateway.routes[2].uri=lb://department-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/departments/**
spring.cloud.gateway.routes[2].filters[0]=StripPrefix=1
spring.cloud.gateway.routes[2].filters[1].name=Retry
spring.cloud.gateway.routes[2].filters[1].args.retries=2
spring.cloud.gateway.routes[2].filters[1].args.methods=GET
spring.cloud.gateway.routes[2].filters[1].args.series=SERVER_ERROR
spring.cloud.gateway.routes[2].filters[1].args.backoff.firstBackoff=100ms
spring.cloud.gateway.routes[2].filters[1].args.backoff.maxBackoff=1s
spring.cloud.gateway.routes[2].filters[1].args.backoff.factor=2
spring.cloud.gateway.routes[2].filters[2].name=CircuitBreaker
spring.cloud.gateway.routes[2].filters[2].args.name=departmentCb
spring.cloud.gateway.routes[2].filters[2].args.fallbackUri=forward:/fallback

# Eureka client
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# Auth demo defaults
acme.auth.jwt-secret=${JWT_SECRET:dev-only-secret-change-me-please-32-bytes-min}
acme.auth.token-ttl=${JWT_TTL:8h}
acme.auth.admin-password=${ADMIN_PASSWORD:admin123}
acme.auth.viewer-password=${VIEWER_PASSWORD:viewer123}

# Actuator endpoints
management.endpoints.web.exposure.include=health,info
