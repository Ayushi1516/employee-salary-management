# Server
server.port=8082

# Application name
spring.application.name=salary-service

# Datasource
spring.datasource.url=jdbc:mysql://localhost:3306/salarydb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none

# Kafka producer
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092}
spring.kafka.producer.acks=all
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.spring.json.add.type.headers=false

# Eureka client
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true


# Resilience4j circuit breaker
resilience4j.circuitbreaker.instances.employeeService.sliding-window-size=20
resilience4j.circuitbreaker.instances.employeeService.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.employeeService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.employeeService.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.instances.employeeService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.employeeService.ignore-exceptions=com.salary_service.exceptions.EmployeeNotFoundException

# Resilience4j retry
resilience4j.retry.instances.employeeService.max-attempts=3
resilience4j.retry.instances.employeeService.wait-duration=200ms
resilience4j.retry.instances.employeeService.enable-exponential-backoff=true
resilience4j.retry.instances.employeeService.exponential-backoff-multiplier=2
resilience4j.retry.instances.employeeService.retry-exceptions=org.springframework.web.client.ResourceAccessException,org.springframework.web.client.HttpServerErrorException

# FX conversion rates
acme.fx.rates.USD=1.0
acme.fx.rates.EUR=1.08
acme.fx.rates.GBP=1.27
acme.fx.rates.INR=0.012
acme.fx.rates.CAD=0.73
acme.fx.rates.AUD=0.66
acme.fx.rates.SGD=0.74
acme.fx.rates.JPY=0.0067
acme.fx.rates.BRL=0.18

# Actuator endpoints
management.endpoints.web.exposure.include=health,info
